name: Telegram Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Telegram APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;26.3.11579264"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          EOF

      - name: Remove local proxy settings
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/^[[:space:]]*systemProp\.http\.proxyHost[[:space:]]*=/d' gradle.properties
            sed -i '/^[[:space:]]*systemProp\.http\.proxyPort[[:space:]]*=/d' gradle.properties
            sed -i '/^[[:space:]]*systemProp\.https\.proxyHost[[:space:]]*=/d' gradle.properties
            sed -i '/^[[:space:]]*systemProp\.https\.proxyPort[[:space:]]*=/d' gradle.properties
          fi

      - name: Verify Android toolchain
        run: |
          echo "Java:"
          java -version

          echo "Gradle:"
          ./gradlew --version

          echo "Android SDK:"
          sdkmanager --list_installed | grep -E \
            'platforms;android-(35|36)|build-tools;|cmake;3.22.1|ndk;26.3.11579264' || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Find APK
        if: success()
        run: |
          echo "Generated APK files:"
          find TMessagesProj_App/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Wyng-debug
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
